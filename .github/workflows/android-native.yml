name: Native Android checks

on:
  push:
    paths: ["android-native/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["android-native/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Install compile platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build and verify
        run: bash gradlew help assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buildledger-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-check-reports
          path: |
            android-native/app/build/reports/tests/
            android-native/app/build/reports/lint-results-debug.*
