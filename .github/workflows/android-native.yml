name: Native Android checks

on:
  push:
    paths: ["android-native/**", "app/**", "gradle/**", "gradlew*", "*.gradle.kts", "gradle.properties", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["android-native/**", "app/**", "gradle/**", "gradlew*", "*.gradle.kts", "gradle.properties", ".github/workflows/android-native.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"
      - name: Build and verify
        run: bash gradlew help :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Migration, backup and navigation gate
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --class com.constructioncost.nativeapp.data.local.LedgerMigrationTest
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --class com.constructioncost.nativeapp.data.backup.BackupServiceTest
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --class com.constructioncost.nativeapp.ActivityRecreationTest
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --class com.constructioncost.nativeapp.DocumentNavigationTest
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --class com.constructioncost.nativeapp.LedgerOperationsTest
            python3 android-native/scripts/test-device.py --serial emulator-5554 --disposable --mode verification --class com.constructioncost.nativeapp.LedgerRestoreRecreationTest
            bash gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buildledger-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-check-reports
          include-hidden-files: true
          path: |
            android-native/app/build/reports/tests/
            android-native/app/build/reports/lint-results-*
            android-native/app/build/outputs/mapping/release/
            .tools/device-runs/
